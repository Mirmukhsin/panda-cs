name: Render Keep-Alive

on:
  schedule:
    # Trigger every 10 minutes to prevent Render free-tier spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive-ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl --fail --max-time 30 --retry 3 --retry-delay 5 https://panda-cs.onrender.com/api/v1/health || \
          curl --fail --max-time 30 --retry 3 --retry-delay 5 https://panda-cs.onrender.com/
