server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: cs2-superhub

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cs2hub
    username: ${DB_USER:cs2admin}
    password: ${DB_PASSWORD:cs2password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    create-schemas: true
    locations:
      - classpath:db/migration
    schemas:
      - identity
      - loadouts
      - minigames
      - stratboard
      - matches

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

app:
  version: 0.0.1-SNAPSHOT
  jwt:
    # 256-bit secure secret key for local development (HMAC-SHA256)
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 604800000 # 7 days in milliseconds (7 * 24 * 60 * 60 * 1000)
  steam:
    api-key: ${STEAM_API_KEY:}
    realm: ${STEAM_REALM:http://localhost:8080}
    return-to: ${STEAM_RETURN_TO:http://localhost:8080/api/v1/auth/steam/callback}
    frontend-redirect-url: ${FRONTEND_AUTH_REDIRECT:http://localhost:3000/auth/callback}
  auth:
    dev-mode-enabled: ${AUTH_DEV_MODE:true}
  loadouts:
    skins-api-url: ${SKINS_API_URL:https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json}
    stickers-api-url: ${STICKERS_API_URL:https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/stickers.json}
  matches:
    worker-secret: ${WORKER_SHARED_SECRET:dev-worker-secret-key}
